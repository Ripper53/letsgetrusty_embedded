[workspace]
resolver = "3"
members = [
    "embedded_runner",
    "embedded_tester",
    "embedded_tester_core",
    "embedded_tester_derive",
]

[profile.dev]
codegen-units = 1
debug = true
lto = false
opt-level = "z"
panic = "abort"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
panic = "abort"
