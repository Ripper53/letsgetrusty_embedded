[package]
name = "embedded_runner"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded_tester = { path = "../embedded_tester" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
panic-halt = "1.0.0"

[[bin]]
name = "embedded_runner"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
lto = false
opt-level = "z"

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
